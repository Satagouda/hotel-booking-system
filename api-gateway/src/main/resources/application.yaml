spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: hotel-service
          uri: lb://HOTEL-SERVICE
          predicates:
            - Path=/hotels/**

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/booking/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
server:
  port: 8080


